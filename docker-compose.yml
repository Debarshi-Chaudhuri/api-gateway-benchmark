version: '3'

services:
  # Redis with TLS
  redis:
    image: redis:alpine
    networks:
      - api-network
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ./tls/redis:/etc/redis/certs
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  # Backend Service with TLS
  http-service:
    build:
      context: .
      dockerfile: http-service/Dockerfile
    environment:
      - PORT=8000
      - TLS_CERT=/etc/http-service/certs/http.crt
      - TLS_KEY=/etc/http-service/certs/http.key
    volumes:
      - ./tls/http:/etc/http-service/certs
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/etc/http-service/certs/ca.crt", "--insecure", "https://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

