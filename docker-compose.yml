version: '3'

services:
  # Redis for Tyk
  redis:
    image: redis:alpine
    networks:
      - api-network
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ["redis-server", "--appendonly", "yes"]

  # MongoDB for Tyk Pump analytics
  mongodb:
    image: mongo:6.0
    networks:
      - api-network
    volumes:
      - mongo_data:/data/db
    restart: always
    ports:
      - "27017:27017"
    command: --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Service
  http-service:
    build:
      context: .
      dockerfile: http-service/Dockerfile
    environment:
      - PORT=8000
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Use host mode for better performance during benchmarks
    # This exposes the service directly on host port 8000
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Tyk Gateway
  tyk-gateway:
    build:
      context: .
      dockerfile: tyk/Dockerfile
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - api-network
    depends_on:
      redis:
        condition: service_healthy
      http-service:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - TYK_GW_ANALYTICSCONFIG_ENABLEANALYTICS=true

  # Tyk Pump for Analytics
  tyk-pump:
    image: tykio/tyk-pump-docker-pub:v1.12.0
    networks:
      - api-network
    volumes:
      - ./tyk/pump/pump.conf:/opt/tyk-pump/pump.conf
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      tyk-gateway:
        condition: service_started
    restart: unless-stopped
    
  # KrakenD Gateway
