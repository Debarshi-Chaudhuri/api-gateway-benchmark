version: "2"

run:
  # Timeout for running linters, default is 1m
  timeout: 5m
  # Include test files in analysis
  tests: true

# Output configuration
output:
  # Format: colored-line-number|line-number|json|tab|checkstyle|code-climate|junit-xml|github-actions
  formats:
    # Prints issues in a text format with colors, line number, and linter name.
    # This format is the default format.
    text:
      # Output path can be either `stdout`, `stderr` or path to the file to write to.
      # Default: stdout
      path: stdout
      # Print linter name in the end of issue text.
      # Default: true
      print-linter-name: true
      # Print lines of code with issue.
      # Default: true
      print-issued-lines: true
      # Use colors.
      # Default: true
      colors: true

formatters:
  # Enable specific formatter.
  # Default: [] (uses standard Go formatting)
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
        
  exclusions:
    # Mode of the generated files analysis.
    #
    # - `strict`: sources are excluded by strictly following the Go generated file convention.
    #    Source files that have lines matching only the following regular expression will be excluded: `^// Code generated .* DO NOT EDIT\.$`
    #    This line must appear before the first non-comment, non-blank text in the file.
    #    https://go.dev/s/generatedcode
    # - `lax`: sources are excluded if they contain lines like `autogenerated file`, `code generated`, `do not edit`, etc.
    # - `disable`: disable the generated files exclusion.
    #
    # Default: lax
    generated: strict
    # Which file paths to exclude.
    # Default: []
    paths:
      - "^tyk/"

# All available linters
linters:
  enable:
    # The original set of fast linters
    - errcheck        # Checks for unchecked errors
    - ineffassign     # Detects unused variable assignments
    - staticcheck     # Go static analysis tool for bugs, simplifications, etc
    - unused          # Checks for unused constants, variables, functions, and types
    
    # Additional linters for good code practices
    - asciicheck      # Checks that your code does not contain non-ASCII identifiers
    - gomoddirectives # Manage the use of 'replace', 'retract', and 'excludes' directives in go.mod.
    - bidichk         # Checks for dangerous unicode character sequences
    - bodyclose       # Checks whether HTTP response body is closed
    - cyclop          # Checks function and package cyclomatic complexity
    - dogsled         # Checks for too many blank identifiers (e.g., x, _, _, _, := f())
    - dupl            # Tool for code clone detection
    - durationcheck   # Checks for two durations multiplied together
    - errname         # Checks that sentinel errors are prefixed with Err and error types are suffixed with Error
    - errorlint       # Finds code that will cause problems with the error wrapping scheme
    - exhaustive      # Checks exhaustiveness of enum switch statements
    - forbidigo       # Forbids identifiers
    - funlen          # Tool for detection of long functions
    - gochecknoglobals # Checks that no globals are present in code
    - gochecknoinits  # Checks that no init functions are present in code
    - gocognit        # Computes and checks the cognitive complexity of functions
    - goconst         # Finds repeated strings that could be replaced by a constant
    - gocritic        # Provides diagnostics that check for bugs, performance, and style issues
    - gocyclo         # Computes and checks the cyclomatic complexity of functions
    - godot           # Check if comments end with a period
    - godox           # Tool for detection of FIXME, TODO and other comment keywords
    - goprintffuncname # Checks that printf-like functions are named with `f` suffix
    - gosec           # Inspects source code for security problems
    - grouper         # Analyzes expression groups
    - importas        # Enforces consistent import aliases
    - interfacebloat  # Checks size of interfaces
    - lll             # Reports long lines
    - loggercheck     # Checks key value pairs for common logger libraries
    - maintidx        # Measures the maintainability index of a package
    - makezero        # Finds slice declarations with non-zero initial length
    - misspell        # Finds commonly misspelled English words in comments
    - nestif          # Reports deeply nested if statements
    - nilerr          # Finds code that returns nil even if error is not nil
    - nilnil          # Checks that there is no simultaneous return of nil error and invalid value
    - noctx           # Finds sending HTTP request without context.Context
    - nolintlint      # Reports issues in nolint directives
    - nonamedreturns  # Reports all named returns
    - nosprintfhostport # Reports misuse of host:port formatting
    - paralleltest    # Checks that tests use t.Parallel() to run in parallel
    - perfsprint      # Checks that fmt.Sprintf is not called with a single string argument
    - predeclared     # Finds code that shadows predeclared identifiers
    - promlinter      # Checks Prometheus metrics naming
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck    # Checks whether sql.Rows.Err is checked
    - sloglint        # Checks slog logging for consistency
    - sqlclosecheck   # Checks that sql.Rows and sql.Stmt are closed
    - testableexamples # Checks if examples are testable (compilable)
    - testpackage     # Checks that test files are in a separate package ending with the _test suffix
    - thelper         # Checks that test helpers use t.Helper()
    - tparallel       # Checks that tests use t.Parallel() to run in parallel
    - unconvert       # Removes unnecessary type conversions
    - unparam         # Reports unused function parameters
    - usestdlibvars   # Detects use of variables/constants from some std packages
    - wastedassign    # Finds wasted assignment statements
    - wrapcheck       # Checks that errors are wrapped when returned from external packages
    - wsl             # Whitespace Linter - Forces you to use empty lines

  settings:
    cyclop:
      # The maximal code complexity to report
      max-complexity: 15
      # The maximal average package complexity
      package-average: 10.0
      
    dupl:
      # Tokens count to trigger issue
      threshold: 100
      
    errcheck:
      # Report about not checking of errors in type assertions
      check-type-assertions: true
      # Report about assignment of errors to blank identifier
      check-blank: true
      
    exhaustive:
      # Presence of "default" case in switch statements satisfies exhaustiveness
      default-signifies-exhaustive: true
      
    funlen:
      # Checks the number of lines in a function
      lines: 100
      # Checks the number of statements in a function
      statements: 50
      
    gocognit:
      # Minimal code cognitive complexity to report
      min-complexity: 20
      
    gocyclo:
      # Minimal code complexity to report
      min-complexity: 15
      
    godox:
      # Report issues on FIXME, TODO and XXX in comments
      keywords:
        - FIXME
        - TODO
        - XXX
            
    lll:
      # Max line length, lines longer will be reported
      line-length: 80
      
    misspell:
      # Correct spellings
      locale: US
      
    nestif:
      # Minimal complexity of if statements to report
      min-complexity: 5
      
    nolintlint:
      # Enable to require an explanation after each nolint directive
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed
      require-specific: true
      
    revive:
      # https://github.com/mgechev/revive#available-rules
      rules:
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: dot-imports
          disabled: false
        - name: empty-block
          disabled: false
        - name: error-naming
          disabled: false
        - name: error-return
          disabled: false
        - name: error-strings
          disabled: false
        - name: exported
          disabled: false
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: if-return
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: var-naming
          disabled: false
        - name: var-declaration
          disabled: false
        - name: package-comments
          disabled: false
        - name: range
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: time-naming
          disabled: false
        - name: unexported-return
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: errorf
          disabled: false
        - name: superfluous-else
          disabled: false

    gomoddirectives:
      # Check for 'replace', 'retract', and 'excludes' directives in go.mod
      replace-local: true
      replace-allow-list:
        - github.com/TykTechnologies/tyk
        - github.com/TykTechnologies/tyk/ctx
      

  exclusions:
    paths:
      - ^tyk(/.*)?$

# Issues configuration section
issues:
  # Maximum count of issues with the same text
  max-same-issues: 3
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  # Fix found issues (if it's supported by the linter)
  fix: true